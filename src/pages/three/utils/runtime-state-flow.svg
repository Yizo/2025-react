<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FBFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7FAFF"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F5FFFB"/>
      <stop offset="1" stop-color="#E8FFF5"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF8F1"/>
      <stop offset="1" stop-color="#FFF0DC"/>
    </linearGradient>
    <linearGradient id="cardD" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF5F7"/>
      <stop offset="1" stop-color="#FFE8EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7B8BAA" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#4B5D79"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #23324A; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #5E6F8C; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #30415E; }
      .cardTitle { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #23324A; }
      .cardText { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #50627E; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #6A7B95; }
      .pill { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #35507A; }
      .code { font: 600 14px Menlo, Monaco, Consolas, monospace; fill: #35507A; }
      .line { stroke: #4B5D79; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .lineSoft { stroke: #7C8CAA; stroke-width: 2.5; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" rx="28" fill="url(#bg)"/>

  <text x="72" y="86" class="title">Three Runtime 状态流程图</text>
  <text x="72" y="118" class="subtitle">文件：runtime.ts ｜ 主线：create → register → start → running → stop / dispose</text>

  <rect x="66" y="156" width="1468" height="250" rx="28" fill="#FFFFFF" opacity="0.7"/>
  <text x="92" y="194" class="section">主状态流</text>

  <g filter="url(#shadow)">
    <rect x="92" y="226" width="250" height="126" rx="24" fill="url(#cardA)" stroke="#DCE7F6"/>
    <rect x="114" y="246" width="92" height="28" rx="14" fill="#E9F3FF"/>
    <text x="132" y="265" class="pill">入口</text>
    <text x="114" y="305" class="cardTitle">createThreeRuntime()</text>
    <text x="114" y="333" class="cardText">创建 scene / camera / renderer</text>
    <text x="114" y="356" class="cardText">组合 DOM 挂载与清理栈</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="396" y="226" width="250" height="126" rx="24" fill="url(#cardA)" stroke="#DCE7F6"/>
    <rect x="418" y="246" width="116" height="28" rx="14" fill="#EAFBF3"/>
    <text x="438" y="265" class="pill">已创建</text>
    <text x="418" y="305" class="cardTitle">runtime 实例</text>
    <text x="418" y="333" class="cardText">资源已初始化</text>
    <text x="418" y="356" class="cardText">loop 仍未启动</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="700" y="226" width="250" height="126" rx="24" fill="url(#cardB)" stroke="#D9F1E4"/>
    <rect x="722" y="246" width="152" height="28" rx="14" fill="#DDF8E9"/>
    <text x="739" y="265" class="pill">注册阶段</text>
    <text x="722" y="305" class="cardTitle">useFrame / useResize</text>
    <text x="722" y="333" class="cardText">注册 handler 到 Set</text>
    <text x="722" y="356" class="cardText">返回取消注册函数</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1004" y="226" width="250" height="126" rx="24" fill="url(#cardC)" stroke="#F3DFC0"/>
    <rect x="1026" y="246" width="88" height="28" rx="14" fill="#FFE9C6"/>
    <text x="1047" y="265" class="pill">启动</text>
    <text x="1026" y="305" class="cardTitle">start()</text>
    <text x="1026" y="333" class="cardText">先 notifyResize(currentSize)</text>
    <text x="1026" y="356" class="cardText">再启动 startRenderLoop()</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1308" y="226" width="180" height="126" rx="24" fill="url(#cardB)" stroke="#D9F1E4"/>
    <rect x="1330" y="246" width="88" height="28" rx="14" fill="#DDF8E9"/>
    <text x="1352" y="265" class="pill">运行中</text>
    <text x="1330" y="305" class="cardTitle">Running</text>
    <text x="1330" y="333" class="cardText">resize / frame</text>
    <text x="1330" y="356" class="cardText">持续分发</text>
  </g>

  <path d="M342 289H396" class="line"/>
  <path d="M646 289H700" class="line"/>
  <path d="M950 289H1004" class="line"/>
  <path d="M1254 289H1308" class="line"/>

  <path d="M821 225V180H521V225" class="lineSoft"/>
  <text x="566" y="172" class="small">可反复调用，持续注册更多 handler</text>

  <rect x="66" y="440" width="704" height="460" rx="28" fill="#FFFFFF" opacity="0.78"/>
  <text x="92" y="478" class="section">Resize 事件流</text>

  <g filter="url(#shadow)">
    <rect x="92" y="518" width="258" height="112" rx="22" fill="url(#cardA)" stroke="#DCE7F6"/>
    <text x="116" y="562" class="cardTitle">ResizeObserver 触发</text>
    <text x="116" y="590" class="cardText">或 start() 首次主动触发</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="404" y="518" width="300" height="112" rx="22" fill="url(#cardC)" stroke="#F3DFC0"/>
    <text x="428" y="562" class="cardTitle">notifyResize(nextSize)</text>
    <text x="428" y="590" class="cardText">统一入口，准备分发上下文</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="140" y="684" width="250" height="134" rx="22" fill="url(#cardA)" stroke="#DCE7F6"/>
    <text x="164" y="728" class="cardTitle">applyResize()</text>
    <text x="164" y="756" class="cardText">camera.aspect = width / height</text>
    <text x="164" y="779" class="cardText">camera.updateProjectionMatrix()</text>
    <text x="164" y="802" class="cardText">renderer.setSize(..., false)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="444" y="684" width="260" height="134" rx="22" fill="url(#cardB)" stroke="#D9F1E4"/>
    <text x="468" y="728" class="cardTitle">resizeHandlers.forEach()</text>
    <text x="468" y="756" class="cardText">调用 useResize 注册的方法</text>
    <text x="468" y="779" class="cardText">参数来自 buildResizeParams()</text>
  </g>

  <path d="M350 574H404" class="line"/>
  <path d="M554 630V662H265V684" class="line"/>
  <path d="M554 630V684" class="line"/>

  <rect x="830" y="440" width="704" height="460" rx="28" fill="#FFFFFF" opacity="0.78"/>
  <text x="856" y="478" class="section">Frame 事件流</text>

  <g filter="url(#shadow)">
    <rect x="856" y="518" width="268" height="112" rx="22" fill="url(#cardC)" stroke="#F3DFC0"/>
    <text x="880" y="562" class="cardTitle">startRenderLoop()</text>
    <text x="880" y="590" class="cardText">renderer.setAnimationLoop(render)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1178" y="518" width="304" height="112" rx="22" fill="url(#cardA)" stroke="#DCE7F6"/>
    <text x="1202" y="562" class="cardTitle">render(timestamp)</text>
    <text x="1202" y="590" class="cardText">timer.update → delta / elapsed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="876" y="684" width="226" height="142" rx="22" fill="url(#cardD)" stroke="#F2D7E0"/>
    <text x="900" y="728" class="cardTitle">stats.begin()</text>
    <text x="900" y="756" class="cardText">开始采样当前帧</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="684" width="280" height="142" rx="22" fill="url(#cardB)" stroke="#D9F1E4"/>
    <text x="1154" y="728" class="cardTitle">frameHandlers.forEach()</text>
    <text x="1154" y="756" class="cardText">调用 useFrame 注册的方法</text>
    <text x="1154" y="779" class="cardText">参数来自 buildFrameParams()</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1438" y="684" width="72" height="142" rx="22" fill="url(#cardA)" stroke="#DCE7F6"/>
    <text x="1459" y="728" class="cardTitle" font-size="16">默认</text>
    <text x="1452" y="756" class="small">controls</text>
    <text x="1455" y="778" class="small">update</text>
    <text x="1451" y="802" class="small">render</text>
  </g>

  <path d="M1124 574H1178" class="line"/>
  <path d="M1330 630V662H989V684" class="line"/>
  <path d="M1330 630V662H1270V684" class="line"/>
  <path d="M1330 630V662H1474V684" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1128" y="846" width="292" height="42" rx="21" fill="#EEF3FB" stroke="#DCE7F6"/>
    <text x="1178" y="873" class="cardText">stats.end() 收尾并完成这一帧</text>
  </g>

  <path d="M989 826V846H1274V846" class="line"/>
  <path d="M1270 826V846" class="line"/>
  <path d="M1474 826V846H1420" class="line"/>

  <rect x="66" y="922" width="1468" height="26" rx="13" fill="#E8EEF8"/>
  <text x="88" y="940" class="code">stop(): 仅停止 loop ｜ dispose(): stop() + stack.dispose() + clear handlers</text>
</svg>
